name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update version in Cargo.toml
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "Updating Cargo.toml version to: ${VERSION}"
          python3 -c "
          import re
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          new_content = re.sub(r'(?m)^version\s*=\s*\"[^\"]+\"', f'version = \"{VERSION}\"', content, count=1)
          with open('Cargo.toml', 'w') as f:
              f.write(new_content)
          "
          cat Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: |
          dir=$(mktemp -d)
          curl -sSLo "$dir/cross.tar.gz" "https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "$dir/cross.tar.gz" -C "$dir"
          sudo mv "$dir/cross" /usr/local/bin/cross
          echo "Cross version:"
          cross --version

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --verbose --target ${{ matrix.target }} --release
          else
            cargo build --verbose --target ${{ matrix.target }} --release
          fi

      - name: Package release assets
        run: |
          BINARY_NAME="udp-broadcast-relay-rust"
          TARGET_DIR="target/${{ matrix.target }}/release"
          ARCHIVE_NAME="${BINARY_NAME}-${{ matrix.target }}.tar.gz"
          
          # Create temporary packaging directory
          PKG_DIR=$(mktemp -d)
          cp "${TARGET_DIR}/${BINARY_NAME}" "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"
          [ -f LICENSE ] && cp LICENSE "${PKG_DIR}/" || true
          [ -f LICENSE-APACHE ] && cp LICENSE-APACHE "${PKG_DIR}/" || true
          [ -f LICENSE-MIT ] && cp LICENSE-MIT "${PKG_DIR}/" || true
          
          # Compress everything inside PKG_DIR
          tar -czf "${ARCHIVE_NAME}" -C "${PKG_DIR}" .
          
          # Generate SHA256 checksum
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          
          echo "Archive created: ${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            udp-broadcast-relay-rust-${{ matrix.target }}.tar.gz
            udp-broadcast-relay-rust-${{ matrix.target }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
