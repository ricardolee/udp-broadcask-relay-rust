[package]
name = "udp-broadcast-relay-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pnet = "0.35"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
ipnet = "2.12"
socket2 = { version = "0.6", features = ["all"] }
ctrlc = { version = "3.4", features = ["termination"] }

